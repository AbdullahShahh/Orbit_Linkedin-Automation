<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prospect List</title>
  <style>
    :root { --bg: #f3f2ef; --panel: #fff; --text: #1d2226; --muted: #6b6b6b; --line: #e6e6e3; --brand: #0a66c2; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #14181d; --panel: #1d232a; --text: #e8eaed; --muted: #9aa0a6; --line: #2c333b; --brand: #70b5f9; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 960px; margin: 0 auto; padding: 32px 16px 48px; }
    header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 24px; }
    .muted { color: var(--muted); }
    .tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; background: var(--panel); }
    .tabs button { border: 0; background: none; color: var(--text); padding: 7px 16px; font: inherit; font-weight: 600; cursor: pointer; }
    .tabs button + button { border-left: 1px solid var(--line); }
    .tabs button.on { background: var(--brand); color: #fff; }
    section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 20px; overflow: hidden; }
    section h2 { margin: 0; padding: 14px 18px; font-size: 15px; border-bottom: 1px solid var(--line); }
    section h2 span { font-weight: 400; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 8px 18px; }
    td { padding: 10px 18px; border-top: 1px solid var(--line); vertical-align: middle; }
    td.n { color: var(--muted); width: 1%; padding-right: 0; }
    td.name { font-weight: 600; }
    a { color: var(--brand); text-decoration: none; }
    a:hover { text-decoration: underline; }
    td.name, td.co { width: 24%; }
    td.co { word-break: break-word; }
    .empty { padding: 24px 18px; color: var(--muted); }
    @media (max-width: 640px) {
      th { display: none; }
      tr { display: block; padding: 10px 16px; border-top: 1px solid var(--line); }
      td, td.name, td.co { display: block; width: auto; border: 0; padding: 2px 0; }
      tr:first-child { display: none; }
      td.n { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>Prospects</h1><div class="muted" id="sum">Loading…</div></div>
      <div class="tabs" id="tabs">
        <button data-kind="" class="on">All</button><button data-kind="post">Posts</button><button data-kind="job">Jobs</button>
      </div>
    </header>
    <div id="out"></div>
  </main>
  <script>
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const link = (url, text) => (url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(text)}</a>` : esc(text));
    let rows = [];
    let kind = '';

    function table(title, list, isJob) {
      if (!list.length) return `<section><h2>${title} <span>0</span></h2><div class="empty">None yet.</div></section>`;
      return `<section><h2>${title} <span>${list.length}</span></h2><table>
        <tr><th></th><th>Name</th><th>Company</th><th>${isJob ? 'Job' : 'Post'}</th></tr>
        ${list.map((p, i) => `<tr>
          <td class="n">${i + 1}</td>
          <td class="name">${p.person_name ? link(p.person_url, p.person_name) : '<span class="muted">—</span>'}</td>
          <td class="co">${p.company_name ? link(p.company_url, p.company_name) : '<span class="muted">—</span>'}</td>
          <td class="open">${p.url ? link(p.url, (isJob ? p.title || 'View job' : 'View post') + ' ↗') : '<span class="muted">no link</span>'}</td>
        </tr>`).join('')}
      </table></section>`;
    }

    function render() {
      const posts = rows.filter((p) => p.kind === 'post');
      const jobs = rows.filter((p) => p.kind === 'job');
      document.getElementById('sum').textContent = `${posts.length} posts · ${jobs.length} jobs`;
      document.getElementById('out').innerHTML =
        (kind !== 'job' ? table('Posts', posts, false) : '') + (kind !== 'post' ? table('Jobs', jobs, true) : '');
      document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.kind === kind));
    }

    document.getElementById('tabs').addEventListener('click', (e) => {
      const b = e.target.closest('[data-kind]');
      if (b) { kind = b.dataset.kind; render(); }
    });

    fetch('/api/prospects?status=new&limit=1000')
      .then((r) => r.json())
      .then((d) => { rows = d.rows || []; render(); })
      .catch(() => { document.getElementById('sum').textContent = 'Could not load the list – is the server running?'; });
  </script>
</body>
</html>
