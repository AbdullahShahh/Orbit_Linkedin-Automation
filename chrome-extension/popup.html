<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px -apple-system, BlinkMacSystemFont, sans-serif; width: 290px; margin: 0; padding: 14px; color: #1d2226; }
    h1 { font-size: 15px; margin: 0 0 10px; display: flex; gap: 8px; align-items: center; }
    .logo { background: #0a66c2; color: #fff; border-radius: 4px; padding: 1px 6px; font-weight: 800; }
    .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #eee; gap: 8px; }
    .ok { color: #057642; font-weight: 700; }
    .bad { color: #cc1016; font-weight: 700; }
    .tab { font-size: 12px; color: #666; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 170px; }
    button { width: 100%; margin-top: 8px; padding: 8px; border-radius: 16px; border: 1px solid #0a66c2; background: #fff; color: #0a66c2; font-weight: 700; cursor: pointer; }
    button.primary { background: #0a66c2; color: #fff; }
    .err { color: #cc1016; font-size: 12px; margin-top: 6px; }
    .port { display: flex; gap: 6px; margin-top: 10px; align-items: center; font-size: 12px; color: #666; }
    .port input { width: 70px; padding: 4px; }
    .port button { width: auto; margin: 0; padding: 4px 10px; }
  </style>
</head>
<body>
  <h1><span class="logo">in</span> Connect Bot <small id="ver" style="font-weight:400;color:#666;font-size:11px"></small></h1>
  <div class="row"><span>Dashboard server</span><span id="conn">…</span></div>
  <div class="row"><span>LinkedIn tab</span><span id="tab" class="tab">auto</span></div>
  <div id="err" class="err"></div>
  <button class="primary" id="open">Open Dashboard</button>
  <button id="use">Use this tab for automation</button>
  <div class="port">Server port <input id="port" type="number" /> <button id="save">Save</button></div>
  <script src="popup.js"></script>
</body>
</html>
